name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      # Installers are unsigned until a certificate is added (docs/RELEASE.md, "Code signing").
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inventory & Billing ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
