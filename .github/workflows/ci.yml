name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The TS API types must match the committed Rust contract (the Rust job checks the schema).
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npx vite build

  backend:
    name: Rust fmt, clippy, tests
    # Windows is the primary target (docs/ASSUMPTIONS.md A-10) and needs no extra system packages.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend dist folder to exist at compile time.
      - shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: End-to-end (Chrome, real backend)
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Chrome is preinstalled on GitHub's Windows runners (playwright.config.ts uses it).
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: test-results/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Fails on any known vulnerability in what ships. (Dev-only tools are not shipped.)
      - run: npm audit --omit=dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # quick-xml (via tauri-utils) has two advisories that cannot be reached from user input;
      # see docs/SECURITY_REVIEW.md. Remove these two flags when Tauri moves to quick-xml 0.41.
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
