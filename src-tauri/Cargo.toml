[package]
name = "tauri-app"
version = "0.1.0"
description = "Offline-first inventory and billing for small and medium businesses"
edition = "2021"
# Main app binary; src/bin/ holds maintenance tools (migrate-legacy).
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "migrate-legacy"
path = "src/bin/migrate_legacy.rs"

# Development only: the v2 commands over HTTP for the browser preview and Playwright.
[[bin]]
name = "dev-server"
path = "src/bin/dev_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled", "backup"] }
argon2 = "0.5.3"
uuid = { version = "1.8.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
thiserror = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
chrono-tz = "0.10"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Phase 4: LAN hub (HTTPS API), client mode, backups. TLS uses ring only (no cmake/nasm needed).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
mdns-sd = "0.11"
ipnet = "2"
aes-gcm = "0.10"
zstd = "0.13"
# Product pictures: decode, scale and re-encode (pure Rust).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3"


# Argon2 is unusably slow without optimisation; keep tests and dev logins fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
