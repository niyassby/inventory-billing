[package]
name = "tauri-app"
version = "0.1.0"
description = "Offline-first inventory and billing for small and medium businesses"
edition = "2021"
# Main app binary; src/bin/ holds maintenance tools (migrate-legacy).
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "migrate-legacy"
path = "src/bin/migrate_legacy.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled", "backup"] }
argon2 = "0.5.3"
uuid = { version = "1.8.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

